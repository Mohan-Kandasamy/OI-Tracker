<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OI Tracker</title>
    <style>
        :root {
            --bg: #07111f;
            --panel: #111d31;
            --panel-2: #16253d;
            --text: #f3f6ff;
            --muted: #92a0ba;
            --green: #2ecc71;
            --red: #ff5d6c;
            --accent: #4f8cff;
            --accent-2: #7c5cff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg), #14243d 60%, #0d1728);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .hero h1 {
            margin: 0;
            font-size: 2rem;
        }

        .hero .pill {
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .panel {
            background: rgba(17, 29, 49, 0.96);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.25);
            margin-bottom: 18px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input, select, button {
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 12px;
            font-size: 0.96rem;
            background: var(--panel-2);
            color: var(--text);
        }

        button {
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            font-weight: 600;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .card strong {
            display: block;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .card .value {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .legend {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.up { background: var(--green); }
        .dot.down { background: var(--red); }
        .dot.neutral { background: #f5b642; }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.9rem;
        }

        th {
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            position: sticky;
            top: 0;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.04);
        }

        .positive { color: var(--green); font-weight: 700; }
        .negative { color: var(--red); font-weight: 700; }
        .neutral { color: #f5b642; }

        .prob-bar {
            height: 8px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 6px;
        }

        .prob-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--green));
        }

        .small { color: var(--muted); font-size: 0.8rem; }

        @media (max-width: 900px) {
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <div>
                <h1>📊 OI Tracker</h1>
                <p class="small">Index option analysis for Nifty and Sensex</p>
            </div>
            <div class="pill">GitHub Pages ready</div>
        </header>

        <section class="panel">
            <div class="controls">
                <label>
                    Underlying
                    <select id="underlying">
                        <option value="nifty">Nifty</option>
                        <option value="sensex">Sensex</option>
                    </select>
                </label>
                <label>
                    Expiry Date
                    <input id="expiryDate" type="date" />
                </label>
                <label>
                    Time Interval
                    <select id="interval">
                        <option value="1">1 min</option>
                        <option value="3">3 min</option>
                        <option value="5" selected>5 min</option>
                        <option value="15">15 min</option>
                        <option value="60">1 hour</option>
                        <option value="240">4 hour</option>
                        <option value="1440">1 day</option>
                        <option value="10080">1 week</option>
                    </select>
                </label>
                <button id="refreshBtn" type="button">Refresh</button>
            </div>

            <div class="summary" id="summary"></div>
            <div class="legend">
                <span><i class="dot up"></i>Up move</span>
                <span><i class="dot down"></i>Down move</span>
                <span><i class="dot neutral"></i>Neutral / flat</span>
            </div>
        </section>

        <section class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Time Interval</th>
                        <th>Strike Price</th>
                        <th>Put LTP</th>
                        <th>Probability</th>
                        <th>Triggered Price</th>
                        <th>O=H / O=L</th>
                        <th>Call LTP</th>
                        <th>Δ Put OI</th>
                        <th>Δ Call OI</th>
                        <th>Diff OI</th>
                        <th>Diff OI %</th>
                        <th>Direction</th>
                        <th>Change</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>
    </div>

    <script>
        const configs = {
            nifty: { label: 'Nifty', spot: 24000, step: 50, expiry: '2026-08-27' },
            sensex: { label: 'Sensex', spot: 79000, step: 100, expiry: '2026-08-27' }
        };

        const intervalMap = {
            1: '1 min',
            3: '3 min',
            5: '5 min',
            15: '15 min',
            60: '1 hour',
            240: '4 hour',
            1440: '1 day',
            10080: '1 week'
        };

        const underlyingEl = document.getElementById('underlying');
        const expiryEl = document.getElementById('expiryDate');
        const intervalEl = document.getElementById('interval');
        const summaryEl = document.getElementById('summary');
        const tableBodyEl = document.getElementById('tableBody');
        const refreshBtn = document.getElementById('refreshBtn');

        function formatCurrency(value) {
            return `₹${value.toLocaleString('en-IN')}`;
        }

        function formatPct(value) {
            return `${value.toFixed(1)}%`;
        }

        function getDefaultExpiry() {
            const today = new Date();
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);
            return nextWeek.toISOString().split('T')[0];
        }

        function buildRows(config, intervalValue) {
            const spot = config.spot;
            const step = config.step;
            const rows = [];
            const lowerBound = spot - 20 * step;
            const upperBound = spot + 20 * step;
            for (let i = 0; i <= 40; i++) {
                const strike = lowerBound + i * step;
                const distance = Math.abs(strike - spot);
                const premiumWeight = Math.max(10, 120 - distance * 0.45);
                const putLtp = Math.round((premiumWeight + intervalValue * 0.3) * 10) / 10;
                const callLtp = Math.round((premiumWeight * 0.82 + intervalValue * 0.2) * 10) / 10;
                const probability = Math.min(95, Math.max(8, 92 - distance * 0.18));
                const trigger = Math.round((strike + (putLtp - callLtp) / 2) * 10) / 10;
                const putOiChange = Math.round((distance / 10) * (strike >= spot ? 1.4 : -1.2) + intervalValue / 20);
                const callOiChange = Math.round((distance / 12) * (strike >= spot ? 1.2 : -1.4) + intervalValue / 24);
                const diffOi = callOiChange - putOiChange;
                const diffPct = Math.round((diffOi / Math.max(1, Math.abs(putOiChange))) * 100 * 10) / 10;
                const direction = diffOi > 0 ? 'up' : diffOi < 0 ? 'down' : 'neutral';
                const changeMarker = diffOi > 0 ? '↑' : diffOi < 0 ? '↓' : '→';
                const state = strike > spot ? 'O=H' : strike < spot ? 'O=L' : 'O=H/O=L';
                rows.push({
                    strike,
                    putLtp,
                    probability,
                    trigger,
                    state,
                    callLtp,
                    putOiChange,
                    callOiChange,
                    diffOi,
                    diffPct,
                    direction,
                    changeMarker
                });
            }
            return rows;
        }

        function render() {
            const config = configs[underlyingEl.value];
            const intervalValue = Number(intervalEl.value);
            const expiryValue = expiryEl.value || getDefaultExpiry();
            expiryEl.value = expiryValue;

            const rows = buildRows(config, intervalValue);
            const spotRow = rows.find((row) => row.strike === config.spot);
            summaryEl.innerHTML = `
                <div class="card">
                    <strong>Underlying</strong>
                    <div class="value">${config.label}</div>
                </div>
                <div class="card">
                    <strong>Spot Price</strong>
                    <div class="value">${formatCurrency(config.spot)}</div>
                </div>
                <div class="card">
                    <strong>Expiry</strong>
                    <div class="value">${expiryValue}</div>
                </div>
                <div class="card">
                    <strong>Interval</strong>
                    <div class="value">${intervalMap[intervalValue]}</div>
                </div>
                <div class="card">
                    <strong>Current Trigger</strong>
                    <div class="value">${spotRow ? formatCurrency(spotRow.trigger) : '-'}</div>
                </div>
                <div class="card">
                    <strong>Signal</strong>
                    <div class="value ${spotRow && spotRow.direction === 'up' ? 'positive' : spotRow && spotRow.direction === 'down' ? 'negative' : 'neutral'}">${spotRow ? spotRow.direction.toUpperCase() : 'NEUTRAL'}</div>
                </div>
            `;

            tableBodyEl.innerHTML = rows.map((row) => {
                const putClass = row.putOiChange > 0 ? 'positive' : row.putOiChange < 0 ? 'negative' : 'neutral';
                const callClass = row.callOiChange > 0 ? 'positive' : row.callOiChange < 0 ? 'negative' : 'neutral';
                const diffClass = row.diffOi > 0 ? 'positive' : row.diffOi < 0 ? 'negative' : 'neutral';
                const dirClass = row.direction === 'up' ? 'positive' : row.direction === 'down' ? 'negative' : 'neutral';
                return `
                    <tr>
                        <td>${intervalMap[intervalValue]}</td>
                        <td>${row.strike.toLocaleString('en-IN')}</td>
                        <td>${formatCurrency(row.putLtp)}</td>
                        <td>
                            ${row.probability.toFixed(1)}%
                            <div class="prob-bar"><div class="prob-fill" style="width:${row.probability}%"></div></div>
                        </td>
                        <td>${formatCurrency(row.trigger)}</td>
                        <td>${row.state}</td>
                        <td>${formatCurrency(row.callLtp)}</td>
                        <td class="${putClass}">${row.putOiChange > 0 ? '+' : ''}${row.putOiChange}</td>
                        <td class="${callClass}">${row.callOiChange > 0 ? '+' : ''}${row.callOiChange}</td>
                        <td class="${diffClass}">${row.diffOi > 0 ? '+' : ''}${row.diffOi}</td>
                        <td class="${diffClass}">${row.diffPct > 0 ? '+' : ''}${row.diffPct}%</td>
                        <td class="${dirClass}">${row.direction.toUpperCase()}</td>
                        <td class="${dirClass}">${row.changeMarker}</td>
                    </tr>
                `;
            }).join('');
        }

        refreshBtn.addEventListener('click', render);
        underlyingEl.addEventListener('change', render);
        intervalEl.addEventListener('change', render);
        expiryEl.addEventListener('change', render);

        render();
    </script>
</body>
</html>
